openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: QueueCraft operations and topic-routing API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: session
    description: Current authenticated session
  - name: dashboard
    description: Operational overview and personal work
  - name: topics
    description: Topic lifecycle and collaboration
  - name: directory
    description: Departments, roles, and people
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /session:
    get:
      operationId: getSession
      tags: [session]
      summary: Get the current session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /preferences/topic-filters:
    get:
      operationId: getTopicFilterPreferences
      tags: [session]
      summary: Get the current user's saved topic filters
      responses:
        "200":
          description: Saved topic filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicFilters"
    patch:
      operationId: updateTopicFilterPreferences
      tags: [session]
      summary: Save the current user's topic filters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicFilters"
      responses:
        "200":
          description: Saved topic filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicFilters"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard KPI and grouped counts
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent operational activity
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /my-work:
    get:
      operationId: getMyWork
      tags: [dashboard]
      summary: Get the current user's topics, milestones, collaborations, and validations
      responses:
        "200":
          description: Personal work overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyWork"
  /validation-queue:
    get:
      operationId: getValidationQueue
      tags: [dashboard]
      summary: Get topics waiting for Service Head validation
      responses:
        "200":
          description: Validation queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"
  /topics:
    get:
      operationId: listTopics
      tags: [topics]
      summary: List topics
      parameters:
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Priority"
        - $ref: "#/components/parameters/DepartmentId"
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Topic list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"
    post:
      operationId: createTopic
      tags: [topics]
      summary: Create a topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicInput"
      responses:
        "201":
          description: Created topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
  /calendar/schedule-preview:
    post:
      operationId: previewScheduleImpact
      summary: Read-only projection of a calendar date edit
      tags: [calendar]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePreviewInput"
      responses:
        "200":
          description: Projected changes; no schedule or audit data is written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleImpact"
        "400":
          description: Invalid dates
        "403":
          description: Topic management permission required
        "404":
          description: Topic or milestone not found
        "409":
          description: Dependency rules prevent this edit
  /calendar/topics:
    get:
      operationId: listCalendarTopics
      tags: [topics]
      summary: List all topics and their milestone schedules for the calendar
      responses:
        "200":
          description: Calendar topic schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarTopic"
  /topics/dependency-candidates:
    get:
      operationId: listDependencyCandidates
      tags: [topics]
      summary: List eligible prerequisite topics, including those awaiting a finish estimate
      parameters:
        - name: topicId
          in: query
          description: Exclude this topic and its dependents when editing
          schema: { type: string }
      responses:
        "200":
          description: Topics that can be selected as prerequisites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopicDependency"
  /topics/{topicId}:
    get:
      operationId: getTopic
      tags: [topics]
      summary: Get a topic
      parameters:
        - $ref: "#/components/parameters/TopicId"
      responses:
        "200":
          description: Topic details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTopic
      tags: [topics]
      summary: Update editable topic fields
      parameters:
        - $ref: "#/components/parameters/TopicId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicUpdate"
      responses:
        "200":
          description: Updated topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
    delete:
      operationId: deleteTopic
      tags: [topics]
      summary: Delete a topic and its dependent work records
      parameters:
        - $ref: "#/components/parameters/TopicId"
      responses:
        "204":
          description: Topic deleted
        "403":
          description: Only the local admin or this department's Service Head or Deputy may delete
        "404":
          $ref: "#/components/responses/NotFound"
  /topics/{topicId}/finish-date:
    patch:
      operationId: updateTopicFinishDate
      tags: [topics]
      summary: Update the committed finish date with a required scope note
      parameters:
        - $ref: "#/components/parameters/TopicId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishDateUpdate"
      responses:
        "200":
          description: Updated topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
  /topics/{topicId}/allocations:
    get:
      operationId: getTopicAllocations
      tags: [topics]
      summary: Get historical topic-level allocations (read-only; not counted in occupancy)
      parameters:
        - $ref: "#/components/parameters/TopicId"
      responses:
        "200":
          description: Topic allocations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TopicAllocation" }
  /topics/{topicId}/validate:
    post:
      operationId: validateTopic
      tags: [topics]
      summary: Validate a topic as the responsible Service Head or Deputy
      parameters:
        - $ref: "#/components/parameters/TopicId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationInput"
      responses:
        "200":
          description: Validated topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
  /topics/{topicId}/validation-break-glass:
    post:
      operationId: validateTopicBreakGlass
      tags: [topics]
      summary: Validate outside assigned department scope with an audited explanation
      parameters:
        - $ref: "#/components/parameters/TopicId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BreakGlassValidationInput"
      responses:
        "200":
          description: Validated topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
  /topics/{topicId}/assign:
    post:
      operationId: assignTopic
      tags: [topics]
      summary: Assign a primary owner
      parameters:
        - $ref: "#/components/parameters/TopicId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentInput"
      responses:
        "200":
          description: Assigned topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
  /topics/{topicId}/collaborators:
    post:
      operationId: addTopicCollaborator
      tags: [topics]
      summary: Add a topic-scoped collaborator
      parameters:
        - $ref: "#/components/parameters/TopicId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollaboratorInput"
      responses:
        "201":
          description: Added collaborator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicCollaborator"
  /topics/{topicId}/collaborators/{collaboratorId}:
    delete:
      operationId: deleteTopicCollaborator
      tags: [topics]
      summary: Remove a collaborator and their topic allocation and milestone links
      parameters:
        - $ref: "#/components/parameters/TopicId"
        - name: collaboratorId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Collaborator removed
        "403":
          description: Topic management permission required
        "404":
          $ref: "#/components/responses/NotFound"
  /topics/{topicId}/milestones:
    post:
      operationId: addTopicMilestone
      tags: [topics]
      summary: Add a milestone, optionally after another milestone in the same topic
      parameters:
        - $ref: "#/components/parameters/TopicId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneInput"
      responses:
        "201":
          description: Added milestone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
  /milestones/{milestoneId}:
    patch:
      operationId: updateMilestone
      tags: [topics]
      summary: Update a milestone
      parameters:
        - $ref: "#/components/parameters/MilestoneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneUpdate"
      responses:
        "200":
          description: Updated milestone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
    delete:
      operationId: deleteMilestone
      tags: [topics]
      summary: Delete a milestone
      parameters:
        - $ref: "#/components/parameters/MilestoneId"
      responses:
        "204": { description: Milestone deleted }
  /occupancy/overview:
    get:
      operationId: getOccupancyOverview
      tags: [dashboard]
      summary: Get member occupancy for a week
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Occupancy overview
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OccupancyOverview" }
  /occupancy/availability:
    get:
      operationId: getOccupancyAvailability
      tags: [dashboard]
      summary: Get date-specific member capacity excluding a milestone being edited
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - name: excludeMilestoneId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Capacity before the proposed allocation, using inclusive working days
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MemberAvailability" }
        "400":
          description: Invalid date range
  /occupancy/forecast:
    get:
      operationId: getOccupancyForecast
      tags: [dashboard]
      summary: Get weekly occupancy for active members in a planning range
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Full Monday-to-Sunday weeks intersecting the range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccupancyForecast"
  /directory/departments:
    get:
      operationId: listDepartments
      tags: [directory]
      summary: List departments and validation authorities
      responses:
        "200":
          description: Departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [directory]
      summary: Create a department and assign its service authorities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Created department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
  /directory/departments/{departmentId}:
    patch:
      operationId: updateDepartment
      tags: [directory]
      summary: Update a department and its service authorities
      parameters:
        - $ref: "#/components/parameters/DepartmentPathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentUpdate"
      responses:
        "200":
          description: Updated department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
  /directory/roles:
    get:
      operationId: listRoles
      tags: [directory]
      summary: List roles
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      operationId: createRole
      tags: [directory]
      summary: Create a role and assign its lead and optional deputy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: Created role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
  /directory/roles/{roleId}:
    patch:
      operationId: updateRole
      tags: [directory]
      summary: Update a role and its membership
      parameters:
        - $ref: "#/components/parameters/RolePathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
    delete:
      operationId: deleteRole
      tags: [directory]
      summary: Remove an active role while retaining historical topics
      parameters:
        - $ref: "#/components/parameters/RolePathId"
      responses:
        "204":
          description: Role removed from the active directory
        "409":
          description: Move unfinished topics to another role before deletion
  /directory/members:
    get:
      operationId: listMembers
      tags: [directory]
      summary: List available members
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: createMember
      tags: [directory]
      summary: Create a directory member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
  /directory/members/{memberId}:
    patch:
      operationId: updateMember
      tags: [directory]
      summary: Update a directory member
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
  /directory/members/{memberId}/permissions:
    put:
      operationId: updateMemberPermissions
      tags: [directory]
      summary: Assign CIO and department leadership to a member
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberPermissions"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
  /directory/members/{memberId}/password:
    put:
      operationId: resetLocalMemberPassword
      tags: [directory]
      summary: Reset another local member's password
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalPasswordReset"
      responses:
        "204":
          description: Password reset
components:
  parameters:
    TopicId:
      name: topicId
      in: path
      required: true
      schema:
        type: string
    MilestoneId:
      name: milestoneId
      in: path
      required: true
      schema:
        type: string
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
    DepartmentPathId:
      name: departmentId
      in: path
      required: true
      schema:
        type: string
    RolePathId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
    DepartmentId:
      name: departmentId
      in: query
      schema:
        type: string
    RoleId:
      name: roleId
      in: query
      schema:
        type: string
    Search:
      name: search
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Status:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/TopicStatus"
    Priority:
      name: priority
      in: query
      schema:
        $ref: "#/components/schemas/TopicPriority"
    StartDate:
      name: startDate
      in: query
      required: true
      schema:
        type: string
        format: date
    EndDate:
      name: endDate
      in: query
      required: true
      schema:
        type: string
        format: date
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Session:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/Member"
        authProvider: { type: ["string", "null"] }
        capabilities:
          type: array
          items:
            type: string
        topicFilters:
          $ref: "#/components/schemas/TopicFilters"
    TopicFilters:
      type: object
      properties:
        departmentId: { type: ["string", "null"] }
        roleId: { type: ["string", "null"] }
        status:
          anyOf:
            - $ref: "#/components/schemas/TopicStatus"
            - type: "null"
        priority:
          anyOf:
            - $ref: "#/components/schemas/TopicPriority"
            - type: "null"
    TopicStatus:
      type: string
      enum:
        [
          pipeline,
          not_pursued,
          pending_validation,
          open,
          in_progress,
          completed,
          closed,
          returned,
          rejected,
        ]
    TopicPriority:
      type: string
      enum: [P1, P2, P3, P4]
    MilestoneStatus:
      type: string
      enum: [not_started, in_progress, returned, completed, blocked]
    ValidationMode:
      type: string
      enum: [standard, break_glass]
    Member:
      type: object
      required: [id, name, initials, email, dailyBusinessTasks]
      properties:
        id: { type: string }
        name: { type: string }
        initials: { type: string }
        email: { type: string, format: email }
        title: { type: ["string", "null"] }
        status: { type: string, enum: [active, disabled] }
        isCio: { type: boolean }
        authProvider: { type: ["string", "null"] }
        dailyBusinessPercent: { type: integer, minimum: 0, maximum: 100 }
        weeklyHours: { type: ["number", "null"], exclusiveMinimum: 0, maximum: 168, description: "Contracted weekly hours; null when not entered." }
        dailyBusinessTasks:
          description: "Optional named BAU tasks. Names are trimmed; when dailyBusinessPercent is also supplied, its value must equal the task total."
          type: array
          items:
            $ref: "#/components/schemas/DailyBusinessTask"
    MemberInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        title: { type: ["string", "null"], maxLength: 160 }
        weeklyHours: { type: ["number", "null"], exclusiveMinimum: 0, maximum: 168 }
        externalSubject: { type: ["string", "null"], maxLength: 255 }
        isCio: { type: boolean, default: false }
        password: { type: string, minLength: 12, maxLength: 256 }
        headDepartmentIds:
          type: array
          items: { type: string }
        deputyDepartmentIds:
          type: array
          items: { type: string }
        dailyBusinessPercent:
          { type: integer, minimum: 0, maximum: 100, default: 0 }
        dailyBusinessTasks:
          description: "Optional named BAU tasks. An empty array clears all tasks; when dailyBusinessPercent is also supplied, its value must equal the task total."
          type: array
          items:
            $ref: "#/components/schemas/DailyBusinessTask"
    MemberUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        title: { type: ["string", "null"], maxLength: 160 }
        weeklyHours: { type: ["number", "null"], exclusiveMinimum: 0, maximum: 168 }
        externalSubject: { type: ["string", "null"], maxLength: 255 }
        status: { type: string, enum: [active, disabled] }
        isCio: { type: boolean }
        headDepartmentIds:
          type: array
          items: { type: string }
        deputyDepartmentIds:
          type: array
          items: { type: string }
        dailyBusinessPercent: { type: integer, minimum: 0, maximum: 100 }
        dailyBusinessTasks:
          description: "Optional named BAU tasks. An empty array clears all tasks; when dailyBusinessPercent is also supplied, its value must equal the task total."
          type: array
          items:
            $ref: "#/components/schemas/DailyBusinessTask"
    DailyBusinessTask:
      type: object
      required: [name, percent]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        percent: { type: integer, minimum: 0, maximum: 100 }
    MemberPermissions:
      type: object
      required: [isCio, headDepartmentIds, deputyDepartmentIds]
      properties:
        isCio: { type: boolean }
        headDepartmentIds:
          type: array
          items: { type: string }
        deputyDepartmentIds:
          type: array
          items: { type: string }
    LocalPasswordReset:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 12, maxLength: 256 }
    Department:
      type: object
      required: [id, name, serviceHead, serviceHeadDeputy]
      properties:
        id: { type: string }
        name: { type: string }
        serviceHead:
          $ref: "#/components/schemas/Member"
        serviceHeadDeputy:
          anyOf:
            - $ref: "#/components/schemas/Member"
            - type: "null"
    DepartmentInput:
      type: object
      required: [name, serviceHeadId]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        serviceHeadId: { type: string }
        serviceHeadDeputyId: { type: ["string", "null"] }
    DepartmentUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        serviceHeadId: { type: string }
