name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: queuecraft
          POSTGRES_USER: queuecraft
          POSTGRES_PASSWORD: queuecraft-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queuecraft -d queuecraft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PORT: "4173"
      BASE_PATH: "/"
      DATABASE_URL: postgresql://queuecraft:queuecraft-ci@127.0.0.1:5432/queuecraft
      SESSION_SECRET: queuecraft-ci-session-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db run migrate
      - run: pnpm run typecheck
      - run: sh scripts/test-web-cert-watch.sh
      - run: sh scripts/check-kubernetes-package.sh
      - run: pnpm --filter @workspace/api-server run test
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/queuecraft run build