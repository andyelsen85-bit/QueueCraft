apiVersion: v1
kind: Namespace
metadata:
  name: queuecraft
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: queuecraft
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: queuecraft
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: queuecraft-postgres
  template:
    metadata:
      labels:
        app: queuecraft-postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: queuecraft
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: queuecraft-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: queuecraft-secrets
                  key: postgres-password
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: queuecraft
spec:
  selector:
    app: queuecraft-postgres
  ports:
    - port: 5432
---
apiVersion: batch/v1
kind: Job
metadata:
  name: queuecraft-migration
  namespace: queuecraft
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: ghcr.io/OWNER/queuecraft-migration:VERSION
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: queuecraft-secrets
                  key: database-url
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queuecraft-api
  namespace: queuecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queuecraft-api
  template:
    metadata:
      labels:
        app: queuecraft-api
    spec:
      containers:
        - name: api
          image: ghcr.io/OWNER/queuecraft-api:VERSION
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: queuecraft-secrets
                  key: database-url
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: queuecraft-secrets
                  key: session-secret
            - name: PUBLIC_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: queuecraft-secrets
                  key: public-base-url
            - name: ADFS_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: queuecraft-secrets
                  key: adfs-issuer-url
            - name: ADFS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: queuecraft-secrets
                  key: adfs-client-id
            - name: ADFS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: queuecraft-secrets
                  key: adfs-client-secret
            - name: ADFS_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: queuecraft-secrets
                  key: adfs-redirect-uri
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: queuecraft-secrets
                  key: smtp-host
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: queuecraft-secrets
                  key: smtp-user
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: queuecraft-secrets
                  key: smtp-password
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: queuecraft-secrets
                  key: smtp-from
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: queuecraft-api
  namespace: queuecraft
spec:
  selector:
    app: queuecraft-api
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queuecraft-web
  namespace: queuecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queuecraft-web
  template:
    metadata:
      labels:
        app: queuecraft-web
    spec:
      containers:
        - name: web
          image: ghcr.io/OWNER/queuecraft-web:VERSION
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: queuecraft-web
  namespace: queuecraft
spec:
  selector:
    app: queuecraft-web
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: queuecraft
  namespace: queuecraft
spec:
  tls:
    - hosts: [queuecraft.example.internal]
      secretName: queuecraft-tls
  rules:
    - host: queuecraft.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: queuecraft-web
                port:
                  number: 80