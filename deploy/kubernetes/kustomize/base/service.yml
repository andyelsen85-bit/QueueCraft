apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: queuecraft
  labels:
    team: infra
spec:
  selector:
    app: queuecraft
  ports:
    - name: svc-http
      protocol: TCP
      port: 80
      targetPort: 80
    - name: svc-https
      protocol: TCP
      port: 443
      targetPort: 443