apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: queuecraft
spec:
  tls:
    - hosts:
        - queuecraft.example.internal
      secretName: queuecraft-tls
  rules:
    - host: queuecraft.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: queuecraft-web
                port:
                  name: http